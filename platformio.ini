; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Onboard computer para el cohete de ACEMA


[common]
test_framework = unity
lib_extra_dirs =
	lib/actuadores
	lib/sensores
	lib/utils
	lib/sistemas
	lib/LoraWrapped
	lib/sensores/mGPS/src
lib_ldf_mode = deep+
lib_deps =
	madhephaestus/ESP32Servo@^3.1.3
	adafruit/Adafruit BMP280 Library@^3.0.0
	adafruit/Adafruit MPU6050@^2.2.9
	mikalhart/TinyGPSPlus@^1.1.0
;	olkal/HX711_ADC @ ^1.2.12
	denyssene/SimpleKalmanFilter@^0.1.0
	mbed-seeed/BluetoothSerial@0.0.0+sha.f56002898ee8
	jgromes/RadioLib@^7.7.1

build_src_filter =
	+<*>
	-<*.old>
	-<**/*.old>


[env:esp32dev]
;platform = atmelavr
;board = uno
platform = espressif32
board = esp32dev
framework = arduino
build_flags = -D MICRO_ESP32 -D MODULE_SX1278
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
test_speed = 115200     ; Velocidad del monitor durante los tests
lib_deps =
	${common.lib_deps}
build_src_filter =
	${common.build_src_filter}
	-<main_GSE.cpp>
	-<main_queue.cpp>



# ============================================================================
# ENTORNO 1: ESTACIÓN TERRENA / GSE (ESP32)
# ============================================================================
[env:GSE]
framework = arduino
platform = espressif32
board = esp32dev
build_flags = -D MODULE_SX1278 -D DEBUG
lib_deps =
    ${common.lib_deps}
    madhephaestus/ESP32Servo@^3.1.3
; build_src_filter = +<*> -<main_dummy.cpp> -<main0.cpp> -<main_CPU.cpp> -<main.cpp> -<Domain/> -<core/>
upload_port = /dev/ttyUSB0  ; <-- Forzar este puerto de forma estática
build_src_filter = +<*> -<main_CPU.cpp> -<main_queue.cpp>
# ============================================================================
# ENTORNO 2: COHETE / CPU (ESP32)
# ============================================================================
[env:CPU-esp32]
platform = espressif32
board = esp32dev
build_flags = -D MICRO_ESP32 -D MODULE_SX1278
lib_deps =
    ${common.lib_deps}
    madhephaestus/ESP32Servo@^3.1.3
; build_src_filter = +<*> -<main_dummy.cpp> -<main0.cpp> -<main_CPU.cpp> -<main.cpp> -<Domain/> -<core/>
;upload_port = /dev/ttyUSB0
;upload_port = /dev/ttyACM0
upload_port = COM4
;upload_port = /dev/ttyACM0
;monitor_port = /dev/ttyACM0
monitor_port = COM4
monitor_speed = 115200

# ============================================================================
# ENTORNO 3: COHETE / CPU (ARDUINO NANO)
# ============================================================================
[env:CPU-nano]
platform = atmelavr
board = nanoatmega328new
build_flags = -D MICRO_NANO -D MODULE_SX1262
lib_deps =
    ${common.lib_deps}
; build_src_filter = +<*> -<main_dummy.cpp> -<main0.cpp> -<main_GSE.cpp> -<main.cpp> -<Domain/> -<core/> -<adapters>
upload_port = /dev/ttyUSB1



# Para compilar desde la terminar
# 	pio run -e GSE
# 	pio run -e CPU-esp32
# 	pio run -e CPU-nano
#
# Para cargar al micro
# 	pio run -e CPU-nano -t upload
#
# Ver los puertos activos en Ubuntu
#	ls /dev/ttyUSB* /dev/ttyACM*
#
# Para abrir el monitor serie
# 	pio device monitor -e CPU-esp32
#

; Entorno para testing local (muy rápido, no requiere placa conectada)
[env:native]
platform = native
test_build_src = no    ; Importante: NO compilar el src/ global
lib_ldf_mode = off     ; Desactiva la búsqueda automática de dependencias en lib/

; Construye el entorno de test con solo lo necesario

; Forzamos la inclusión de Unity para que no falle en native
lib_deps = 
    https://github.com/ThrowTheSwitch/Unity.git

test_filter = test_ubx_dispatcher
; Esto incluye explícitamente el archivo de lógica que quieres probar
build_src_filter = +<../../lib/sensores/mGPS/src/UbxDispatcher.cpp> -<main_*.cpp>



; Si tus tests necesitan incluir archivos de src, asegúrate de que 
; estén en el path de inclusión
build_flags = -Isrc